; ===========================================================================
;  MORTAT 视觉自动瞄准  参数文件
;  程序只读 "键=值"；以 ; 或 # 开头的是注释
;  改完直接重跑程序即可，不用重新编译
; ===========================================================================

[serial]
device = /dev/ttyUSB0      ; USB-TTL 的口，ls /dev/ttyUSB* 看实际名字
baud   = 115200            ; 与 ServoConsole.cs 一致，8N1

[camera]
source = 0                 ; 0 = 第 0 个摄像头；也可以写 /dev/video0 或一个视频文件路径
width  = 640
height = 480
fps    = 60

[detect]
work_width       = 640     ; 先缩到这个宽度再识别，速度稳定
min_panel_area   = 2500    ; 底板最小面积（在这个尺度下），太小的噪点直接扔
min_panel_fill   = 0.45    ; 底板填充率下限（底板被白三角和彩图挖空，一般 0.6~0.85）
black_s_max      = 90      ; 黑底板：饱和度上限
black_v_max      = 75      ; 黑底板：亮度上限
white_s_max      = 45      ; 白三角：饱和度上限
white_v_min      = 195     ; 白三角：亮度下限
color_s_min      = 110     ; 彩色图形：饱和度下限
color_v_min      = 90      ; 彩色图形：亮度下限
min_color_area   = 120     ; 单个彩色图形最小面积
red_h_low        = 12      ; 红色 H 区间 [0,12] ∪ [170,179]
red_h_high       = 170
blue_h_low       = 82      ; 蓝色（打印件偏青）H 区间
blue_h_high      = 115
circle_fill_max  = 0.90    ; 填充率小于它 + 圆度够 -> 当圆形
circle_circ_min  = 0.70
allow_shape_only = 1       ; 底板被切掉时，允许只看两个彩色图形（此时判不出左右）
debug            = 1       ; 是否画调试图（关掉能省一点 CPU）

[aim]
; 用哪个轴转向：0 = CH0 180° 舵机（行程有限），1 = CH1 360° 步进（能转整圈，推荐）
axis = 1

; 瞄准模式：
;   side_abs = 高分区在左/右 -> 直接转到 yaw_left_deg / yaw_right_deg（最省事，推荐）
;   side_rel = 在当前角度上 ±side_offset_deg（不想写死绝对角度时用）
;   tag      = 直接瞄准标签本身（用像素偏差算方位角，需要填准 hfov_deg）
mode = side_abs

yaw_left_deg     = 55      ; side_abs：左高分区对应的炮塔角度
yaw_right_deg    = 125     ; side_abs：右高分区对应的炮塔角度
side_offset_deg  = 35      ; side_rel：相对偏转量
aim_offset_deg   = 0       ; tag：瞄准标签后的微调（正数往右）

hfov_deg          = 60     ; 相机水平视场角，只影响 tag 模式
cam_mount_yaw_deg = 0      ; 相机光轴在炮塔坐标里的角度；相机与炮管反着装时填 180
mirror_x          = 0      ; 图像左右镜像了（相机倒装/软件翻转）就填 1
invert_dir        = 0      ; 发现"让右转它却左转"，就填 1

tolerance_deg    = 2.0     ; 误差小于它就不再转（最终精度）
deadband_deg     = 1.0     ; 死区，防止在目标附近来回抖
confirm_frames   = 3       ; 连续 3 帧判成同一侧才相信（抗单帧误识别）
latch_side       = 1       ; 确认后锁存侧别，不会因为闪一下就跑偏
unlatch_s        = 2.0     ; 连续异侧超过 2 秒才允许改判

min_steps        = 1
max_steps_per_cmd = 6      ; 一条指令最多 6 步（12°），然后回读状态再决定，闭环更稳
step_deg         = 2.0     ; 必须和固件里的步长一致（ServoConsole 的"步长°"）

seek_enabled     = 1       ; 视野里没有标签时左右扫视找
seek_range_deg   = 120     ; 扫视范围 ±120°
seek_step        = 2       ; 每次扫视走几步
seek_interval_s  = 0.9     ; 每次扫视间隔

servo_min_deg    = 5       ; 仅 axis=0 时生效：180° 舵机机械下限
servo_max_deg    = 175     ; 仅 axis=0 时生效：机械上限

[fire]
enabled     = 0            ; 默认只转向不发射；确认场地安全后改 1
turns       = 1            ; 发射圈数 1~10
speed       = 80           ; 发射速度百分比 20~100
ms_per_turn = 1400         ; 每圈毫秒，与固件一致
cooldown_s  = 5.0          ; 两次自动发射的最小间隔
delay_s     = 0.4          ; 对准后再等多久才打（让舵机停稳）

[run]
gui             = 1        ; 0 = 不弹窗（无显示器的 Ubuntu 用）
freeze_result   = 1        ; 识别成功后冻结一帧、保存结果图（比赛要求留证）
save_result     = 1
result_dir      = results  ; 结果图目录
status_poll_s   = 0.05     ; 多久查一次下位机状态（闭环靠它）
turn_interval_s = 0.18     ; 两条转向指令最小间隔，别把单片机缓冲塞满
