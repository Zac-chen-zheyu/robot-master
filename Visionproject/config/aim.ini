[serial]
device = /dev/ttyUSB0
baud   = 115200

[camera]
source = 0
width  = 640
height = 480
fps    = 60

[detect]
work_width     = 640
min_panel_area = 2500

[aim]
axis              = 1
mode              = side_abs
yaw_left_deg      = 55
yaw_right_deg     = 125
step_deg          = 2.0
tolerance_deg     = 2.0
deadband_deg      = 1.0
max_steps_per_cmd = 6

[fire]
enabled = 0

[run]
gui        = 1
result_dir = results
